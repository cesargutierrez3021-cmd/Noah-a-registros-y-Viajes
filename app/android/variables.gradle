ext {
    // Subido de 23 a 24: el módulo capacitor-cordova-android-plugins (lo
    // arma Capacitor internamente aunque no usemos plugins Cordova) trae
    // org.apache.cordova:framework:14.0.1, que exige mínimo API 24 —
    // ver error de "Manifest merger failed" en el build de GitHub Actions
    // del 2026-09-13. API 24 = Android 7.0 (2016), sigue cubriendo casi
    // todos los teléfonos reales en Colombia hoy.
    minSdkVersion = 24
    compileSdkVersion = 35
    targetSdkVersion = 35
    androidxActivityVersion = '1.9.3'
    androidxAppCompatVersion = '1.7.0'
    androidxCoordinatorLayoutVersion = '1.2.0'
    androidxCoreVersion = '1.15.0'
    androidxFragmentVersion = '1.8.5'
    playServicesLocationVersion = '21.3.0'
    androidxWebkitVersion = '1.12.1'
}
