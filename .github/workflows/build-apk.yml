name: build-apk

# 2026-09-15: se quitaron los pasos "Descomprimir el proyecto" / "Publicar
# código fuente para Render" — eran de la época en que el código llegaba
# como MIAPROYECTO.zip subido a mano; ese archivo ya no existe en el repo
# (se borró hace varias sesiones), así que ese `unzip` fallaba siempre. El
# código fuente ya está commiteado directo, no hace falta desempaquetar nada.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Instalar dependencias del cliente
        working-directory: app
        run: npm install
      - name: Build web (vite)
        working-directory: app
        env:
          VITE_API_URL: https://mia-backend-kqms.onrender.com
        run: npm run build
      - name: Sincronizar Capacitor -> Android
        working-directory: app
        run: npx cap sync android
      - name: Generar el wrapper de Gradle
        working-directory: app/android
        run: gradle wrapper --gradle-version 8.10.2
      - name: Compilar APK debug
        working-directory: app/android
        run: ./gradlew assembleDebug
      - name: Subir APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: mia-debug-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
