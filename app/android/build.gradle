// Proyecto raíz Gradle — armado a mano en esta sesión porque el zip de
// Fase 5 nunca incluyó el proyecto Android real (ver PLAN-MAESTRO.md,
// "Estado real de Fase 5", pendiente #1).
buildscript {
    // Necesario porque MainActivity.java (Java) usa 3 plugins nativos escritos
    // en Kotlin (GpsTrackingPlugin, AlarmaPantallaPlugin, BurbujaPlugin) — sin
    // este plugin, Gradle nunca compila los .kt y Java falla con
    // "package ... does not exist" al intentar importarlos.
    // 2.1.0, no 1.9.24 — @capacitor/geolocation y @capacitor/local-notifications
    // (Kotlin real, no bundle propio) ya obligan a esta versión más nueva por
    // su cuenta; dejar el Gradle plugin de Kotlin en una versión más vieja
    // mezcla dos stdlib distintos en el mismo build y rompe hasta código
    // básico como `let`/`it` con errores sin sentido de "unresolved reference".
    ext.kotlin_version = '2.1.0'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply from: "variables.gradle"

task clean(type: Delete) {
    delete rootProject.buildDir
}
