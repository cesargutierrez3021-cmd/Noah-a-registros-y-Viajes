// Proyecto raíz Gradle — armado a mano en esta sesión porque el zip de
// Fase 5 nunca incluyó el proyecto Android real (ver PLAN-MAESTRO.md,
// "Estado real de Fase 5", pendiente #1).
buildscript {
    // Necesario porque MainActivity.java (Java) usa 3 plugins nativos escritos
    // en Kotlin (GpsTrackingPlugin, AlarmaPantallaPlugin, BurbujaPlugin) — sin
    // este plugin, Gradle nunca compila los .kt y Java falla con
    // "package ... does not exist" al intentar importarlos.
    // 2.3.20 — versión estable real confirmada por búsqueda (no adivinada),
    // compatible con Gradle 8.10.2 (Kotlin 2.3.20 soporta Gradle 7.6.3 a 9.3.0).
    ext.kotlin_version = '2.3.20'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply from: "variables.gradle"

task clean(type: Delete) {
    delete rootProject.buildDir
}
