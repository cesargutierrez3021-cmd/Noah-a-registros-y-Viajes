apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace "com.noah.conductor.atlas"
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.noah.conductor.atlas"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "0.1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = "21"
    }
}

// AGP 8.7.2 (la que usamos) recomienda Java 21, no 17 — confirmado en la
// documentación oficial de Capacitor 8 ("Updating plugins to 8.0"). Antes
// esto decía 17 y por eso chocaba con javac, que sí toma 21 solo para esta
// versión de AGP. jvmToolchain fuerza a que TANTO javac como kotlinc usen
// la misma JVM (21) — sin esto, Gradle los deja elegir por separado y
// rechaza la mezcla con "Inconsistent JVM-target compatibility".
kotlin {
    jvmToolchain(21)
}

repositories {
    flatDir {
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.core:core-splashscreen:1.0.1"
    implementation project(':capacitor-android')
    implementation project(':capacitor-geolocation')
    implementation project(':capacitor-local-notifications')

    // Fase 5 (D-9) — foreground service de GPS: GpsTrackingService.kt usa
    // FusedLocationProviderClient, requiere esta dependencia explícita
    // (docs/FASE5-GPS-MANIFEST.md, punto 4).
    implementation "com.google.android.gms:play-services-location:$playServicesLocationVersion"

    testImplementation "junit:junit:4.13.2"
    androidTestImplementation "androidx.test.ext:junit:1.2.1"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.6.1"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch (Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
