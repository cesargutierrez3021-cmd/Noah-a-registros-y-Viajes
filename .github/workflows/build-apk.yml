name: build-apk

on:
  push:
    branches: [main]
    paths: ['MIAPROYECTO.zip', '.github/workflows/build-apk.yml']
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descomprimir el proyecto
        run: unzip -o MIAPROYECTO.zip -d .
      - name: Publicar código fuente para Render
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app server docs PLAN-MAESTRO.md render.yaml
          git diff --cached --quiet && echo "Sin cambios de código fuente" || git commit -m "Sincronizar código fuente extraído desde MIAPROYECTO.zip"
          git push
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Instalar dependencias del cliente
        working-directory: app
        run: npm install
      - name: Build web (vite)
        working-directory: app
        env:
          VITE_API_URL: https://mia-backend.onrender.com
        run: npm run build
      - name: Sincronizar Capacitor -> Android
        working-directory: app
        run: npx cap sync android
      - name: Generar el wrapper de Gradle
        working-directory: app/android
        run: gradle wrapper --gradle-version 8.10.2
      - name: Compilar APK debug
        working-directory: app/android
        run: ./gradlew assembleDebug
      - name: Subir APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: mia-debug-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
